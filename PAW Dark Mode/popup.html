<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAW Dark Mode Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L20.5 7V17L12 22L3.5 17V7L12 2Z" stroke="#4589ff" stroke-width="1.8" fill="#131a26"/>
            <path d="M14.5 7.5A5 5 0 0 0 9.5 15.8A5.2 5.2 0 0 1 14.5 7.5Z" fill="#e8e8e8"/>
            <circle cx="15.2" cy="11.5" r="2.6" fill="#4589ff" opacity="0.85"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">PAW Dark Mode</h1>
          <p class="brand-subtitle">IBM Planning Analytics Workspace</p>
        </div>
      </div>

      <div class="header-actions">
        <span id="statusBadge" class="status-badge active">Active</span>
        <label class="switch" title="Toggle Dark Mode">
          <input type="checkbox" id="enabledToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <main id="controlsArea" class="controls">
      <!-- Eye Comfort Settings -->
      <section class="section">
        <h2 class="section-title">Eye Comfort Settings</h2>

        <div class="range-group">
          <div class="range-header">
            <label for="brightnessRange">Brightness</label>
            <span id="brightnessVal" class="range-value">100%</span>
          </div>
          <input type="range" id="brightnessRange" min="70" max="110" step="1" value="100">
        </div>

        <div class="range-group">
          <div class="range-header">
            <label for="contrastRange">Contrast</label>
            <span id="contrastVal" class="range-value">100%</span>
          </div>
          <input type="range" id="contrastRange" min="80" max="120" step="1" value="100">
        </div>

        <div class="range-group">
          <div class="range-header">
            <label for="warmthRange">Blue Light Filter (Warmth)</label>
            <span id="warmthVal" class="range-value">0%</span>
          </div>
          <input type="range" id="warmthRange" min="0" max="40" step="1" value="0">
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-buttons">
        <button type="button" id="resetBtn" class="btn btn-secondary">Reset to Defaults</button>
        <button type="button" id="injectBtn" class="btn btn-primary">Apply to Current Tab</button>
      </div>
      <div id="feedbackMsg" class="feedback-msg" role="status" aria-live="polite"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
